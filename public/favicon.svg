<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer circle background -->
  <circle cx="50" cy="50" r="48" fill="#f4d4a8" stroke="#d4a574" stroke-width="2"/>
  
  <!-- Fork (left) -->
  <g transform="translate(25, 50)">
    <!-- Handle -->
    <rect x="-3" y="8" width="6" height="18" fill="#8b5a3c" rx="3"/>
    <!-- Prongs -->
    <rect x="-10" y="-12" width="4" height="20" fill="#8b5a3c" rx="2"/>
    <rect x="-2" y="-12" width="4" height="20" fill="#8b5a3c" rx="2"/>
    <rect x="6" y="-12" width="4" height="20" fill="#8b5a3c" rx="2"/>
  </g>
  
  <!-- Spoon (right) -->
  <g transform="translate(75, 50)">
    <!-- Handle -->
    <rect x="-3" y="8" width="6" height="18" fill="#8b5a3c" rx="3"/>
    <!-- Bowl -->
    <ellipse cx="0" cy="-6" rx="8" ry="10" fill="#8b5a3c"/>
  </g>
</svg>